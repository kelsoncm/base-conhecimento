site_name: Conhecimentos Pessoais
site_description: Anotações técnicas, procedimentos e compartilhamento de conhecimentos pessoais de Kelson da Costa Medeiros.
site_author: Kelson da Costa Medeiros
site_url: https://kelsoncm.github.io/conhecimentos-pessoais/

repo_name: kelsoncm/conhecimentos-pessoais
repo_url: https://github.com/kelsoncm/conhecimentos-pessoais
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para tema claro
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - hooks.py

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/analytics-events.js

extra:
  analytics:
    provider: google
    property: !ENV [GA_MEASUREMENT_ID, "G-EC3SFY8BMQ"]
    feedback:
      title: Este artigo foi útil?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Este artigo resolveu meu problema
          data: 1
          note: >-
            Obrigado pelo seu feedback!
        - icon: material/emoticon-sad-outline
          name: Este artigo precisa de melhorias
          data: 0
          note: >-
            Obrigado pelo retorno. Sugestões podem ser enviadas abrindo uma issue no repositório.
  consent:
    title: Consentimento de Cookies
    description: >-
      Utilizamos cookies e métricas anônimas de acesso para aprimorar este repositório de conhecimentos pessoais, em conformidade com a LGPD.
    actions:
      - accept
      - reject

